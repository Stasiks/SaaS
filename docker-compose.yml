version: '3.8'

services:
  # 1. База данных PostgreSQL
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vton_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vton_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Брокер сообщений Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 3. Наш FastAPI сервер
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # Обрати внимание: хосты теперь не localhost, а имена контейнеров (postgres, redis)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vton_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Наш Воркер TaskIQ (запускаем сразу 4 процесса для скорости)
  worker:
    build: .
    command: taskiq worker app.core.broker:broker app.workers.tryon -w 4
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vton_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy